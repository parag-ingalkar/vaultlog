services:
  redis:
    image: redis:7-alpine
    container_name: vaultlog-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    container_name: vaultlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultlog
      POSTGRES_USER: postgres_bootstrap
      POSTGRES_PASSWORD: postgres_bootstrap_password
    ports:
      - "5432:5432"
    volumes:
      - vaultlog_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultlog_app -d vaultlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: vaultlog-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  vaultlog_postgres_data:
