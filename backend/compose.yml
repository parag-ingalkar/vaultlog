services:
  postgres:
    image: postgres:18-alpine
    container_name: vaultlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultlog
      POSTGRES_USER: postgres_bootstrap
      POSTGRES_PASSWORD: postgres_bootstrap_password
    ports:
      - "5432:5432"
    volumes:
      - vaultlog_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultlog_app -d vaultlog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultlog_postgres_data:
